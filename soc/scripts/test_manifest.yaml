# soc/scripts/test_manifest.yaml
functional:
  - name: nscscc_func
    build_dir: chiplab/software/examples/nscscc_func
    build_target: ""
    output_artifact: chiplab/software/examples/nscscc_func/obj/main.bin
    mem_name: func
    expect:
      num_data: "0x3a00003a"
      led_rg0: "0b01"
      led_rg1: "0b01"
    timeout_cycles: 10_000_000
    stable_cycles: 100_000

